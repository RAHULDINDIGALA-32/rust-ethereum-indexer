[workspace]
resolver = "3"

members = [
    "crates/rpc",
    "crates/ingestion",
    "crates/decoder",
    "crates/storage",
    "crates/api",
    "indexer",
]

[workspace.dependencies]

tokio = {version = "1.0", features = ["full"] }
futures = "0.3"
alloy = {version = "0.7", features = ["providers", "transports", "rpc", "rpc-types"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "bigdecimal"] }
async-graphql = "7"
axum = "0.7"
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
bigdecimal = { version = "0.3", features = ["serde"] }
