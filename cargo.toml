[workspace]
members = [
    "crates/storage",
    "crates/rpc",
    "crates/ingestion",
    "crates/decoder",
    "crates/api",
    "crates/observability",
    "indexer",
]
default-members = ["indexer"]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
alloy = { version = "0.7", features = ["providers", "transports", "rpc", "rpc-types"] }
api = { path = "crates/api" }
async-graphql = "7"
axum = "0.8"
bigdecimal = { version = "0.3", features = ["serde"] }
decoder = { path = "crates/decoder" }
dotenvy = "0.15"
futures = "0.3"
ingestion = { path = "crates/ingestion" }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
observability = { path = "crates/observability" }
rpc = { path = "crates/rpc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "bigdecimal"] }
storage = { path = "crates/storage" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
